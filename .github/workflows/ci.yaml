name: CI - Build and Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main


jobs:

  test:

    name: Unit Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: |
          pytest -v


  docker-build:

    name: Docker Build

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:${{ github.sha }} \
            .


  docker-test:

    name: Docker Container Test

    runs-on: ubuntu-latest

    needs: docker-build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:test \
            .

      - name: Start container
        run: |
          docker run -d \
            --name flask-api \
            -p 5000:5000 \
            aws-cloud-native-observability-platform:test

      - name: Wait for application
        run: |
          sleep 5

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:5000/health

      - name: Test root endpoint
        run: |
          curl --fail http://localhost:5000/

      - name: Test orders endpoint
        run: |
          curl --fail http://localhost:5000/api/orders

      - name: Test metrics endpoint
        run: |
          curl --fail http://localhost:5000/metrics

      - name: Show container logs
        if: always()
        run: |
          docker logs flask-api

      - name: Stop container
        if: always()
        run: |
          docker stop flask-api