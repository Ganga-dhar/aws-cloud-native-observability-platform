name: CI - Build and Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  # ---------------------------------------------------------
# GitHub OIDC permissions
# ---------------------------------------------------------

permissions:
  id-token: write
  contents: read



jobs:
  # =======================================================
  # 1. UNIT TESTS
  # =======================================================

  test:

    name: Unit Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: |
          pytest -v

  # =======================================================
  # 2. DOCKER BUILD
  # =======================================================

  docker-build:

    name: Docker Build

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:${{ github.sha }} \
            .


  # =======================================================
  # 3. TRIVY SECURITY SCAN
  # =======================================================         
  security-scan:

    name: Trivy Container Scan

    runs-on: ubuntu-latest

    needs: docker-build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:scan \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aws-cloud-native-observability-platform:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  # =======================================================
  # 4. DOCKER TEST
  # =======================================================       
  docker-test:

    name: Docker Container Test

    runs-on: ubuntu-latest

    needs: docker-build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:test \
            .

      - name: Start container
        run: |
          docker run -d \
            --name flask-api \
            -p 5000:5000 \
            aws-cloud-native-observability-platform:test

      - name: Wait for application
        run: |
          sleep 5

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:5000/health

      - name: Test root endpoint
        run: |
          curl --fail http://localhost:5000/

      - name: Test orders endpoint
        run: |
          curl --fail http://localhost:5000/api/orders

      - name: Test metrics endpoint
        run: |
          curl --fail http://localhost:5000/metrics

      - name: Show container logs
        if: always()
        run: |
          docker logs flask-api

      - name: Stop container
        if: always()
        run: |
          docker stop flask-api
  




  terraform-ecr:
    name: Terraform - Create ECR

    runs-on: ubuntu-latest

    needs:
      - docker-test

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: |
          terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="aws_region=${{ vars.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}"
  # =======================================================
  # 5. PUSH IMAGE TO ECR
  # =======================================================

  push-to-ecr:

    name: Push Docker Image to ECR

    runs-on: ubuntu-latest
    environment: DEV
    needs:
      - docker-test

    # IMPORTANT:
    # Only push images from main.
    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # AWS OIDC Authentication
      # ---------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
            role-to-assume: ${{ vars.AWS_ROLE_ARN }}
            aws-region: ${{ vars.AWS_REGION }}


      # ---------------------------------------------------
      # Verify AWS identity
      # ---------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ---------------------------------------------------
      # Login to ECR
      # ---------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ---------------------------------------------------
      # Build Docker image
      # ---------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:${{ github.sha }} \
            .


      # ---------------------------------------------------
      # Tag image
      # ---------------------------------------------------

      - name: Tag Docker image
        run: |
          docker tag \
            aws-cloud-native-observability-platform:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/aws-cloud-native-observability-platform:${{ github.sha }}


      # ---------------------------------------------------
      # Push image
      # ---------------------------------------------------

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/aws-cloud-native-observability-platform:${{ github.sha }}