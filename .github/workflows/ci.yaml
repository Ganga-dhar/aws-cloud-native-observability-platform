name: CI - Build and Test

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run Unit Tests"
        required: true
        type: boolean
        default: false

      run_scan:
        description: "Run Trivy Security Scan"
        required: true
        type: boolean
        default: false


# ---------------------------------------------------------
# GitHub OIDC permissions
# ---------------------------------------------------------

permissions:
  id-token: write
  contents: read


jobs:

  # =======================================================
  # 1. UNIT TESTS - MANUAL ONLY
  # =======================================================

  test:

    name: Unit Tests
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.run_tests == true

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: |
          pytest -v


  # =======================================================
  # 2. DOCKER BUILD - AUTOMATIC
  # =======================================================

  docker-build:

    name: Docker Build
    runs-on: ubuntu-latest

    # IMPORTANT:
    # No "needs: test"
    #
    # Unit tests are manual and must not block
    # the automatic pipeline.

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:${{ github.sha }} \
            .


  # =======================================================
  # 3. TRIVY SECURITY SCAN - MANUAL ONLY
  # =======================================================

  security-scan:

    name: Trivy Container Scan
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.run_scan == true

    # IMPORTANT:
    # Do NOT use:
    # needs: docker-build
    #
    # Because this is a manually controlled job.

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:scan \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aws-cloud-native-observability-platform:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  # =======================================================
  # 4. DOCKER TEST - AUTOMATIC
  # =======================================================

  docker-test:

    name: Docker Container Test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.run_scan == true

    # needs:
    #   - docker-build

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:test \
            .

      - name: Start container
        run: |
          docker run -d \
            --name flask-api \
            -p 5000:5000 \
            aws-cloud-native-observability-platform:test

      - name: Wait for application
        run: |
          sleep 5

      - name: Test health endpoint
        run: |
          curl --fail http://localhost:5000/health

      - name: Test root endpoint
        run: |
          curl --fail http://localhost:5000/

      - name: Test orders endpoint
        run: |
          curl --fail http://localhost:5000/api/orders

      - name: Test metrics endpoint
        run: |
          curl --fail http://localhost:5000/metrics

      - name: Show container logs
        if: always()
        run: |
          docker logs flask-api

      - name: Stop container
        if: always()
        run: |
          docker stop flask-api


  # =======================================================
  # 5. TERRAFORM - CREATE ECR
  # =======================================================

  terraform-ecr:

    name: Terraform - Create ECR

    runs-on: ubuntu-latest

    environment: DEV

    # needs:
    #   - docker-test

    permissions:
      id-token: write
      contents: read

    # Only create infrastructure from main
    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # AWS OIDC
      # ---------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ---------------------------------------------------
      # Verify AWS
      # ---------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ---------------------------------------------------
      # Terraform
      # ---------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: terraform/ecr
        run: |
          terraform init

      - name: Terraform Format Check
        working-directory: terraform/ecr
        run: |
          terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform/ecr
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: terraform/ecr
        run: |
          terraform plan \
            -var="aws_region=${{ vars.AWS_REGION }}"

      - name: Terraform Apply
        working-directory: terraform/ecr
        run: |
          terraform apply \
            -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}"


  # =======================================================
  # 6. PUSH IMAGE TO ECR
  # =======================================================

  push-to-ecr:

    name: Push Docker Image to ECR

    runs-on: ubuntu-latest

    environment: DEV

    # IMPORTANT:
    # Must wait for Terraform to create ECR.
    needs:
      - terraform-ecr

    # Only push from main
    if: github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # AWS OIDC Authentication
      # ---------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ---------------------------------------------------
      # Verify AWS identity
      # ---------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ---------------------------------------------------
      # Verify ECR Repository
      # ---------------------------------------------------

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names aws-cloud-native-observability-platform \
            --region ${{ vars.AWS_REGION }}


      # ---------------------------------------------------
      # Login to ECR
      # ---------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ---------------------------------------------------
      # Build Docker image
      # ---------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t aws-cloud-native-observability-platform:${{ github.sha }} \
            .


      # ---------------------------------------------------
      # Tag image
      # ---------------------------------------------------

      - name: Tag Docker image
        run: |
          docker tag \
            aws-cloud-native-observability-platform:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/aws-cloud-native-observability-platform:${{ github.sha }}


      # ---------------------------------------------------
      # Push image
      # ---------------------------------------------------

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/aws-cloud-native-observability-platform:${{ github.sha }}